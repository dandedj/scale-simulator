<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTB Fabric — Connection Storm Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,500;10..72,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header id="header">
        <div class="brand">
          <h1>RTB FABRIC</h1>
          <span class="brand-sub">connection storm simulator</span>
        </div>
        <div id="mode-switch"></div>
        <div id="header-controls"></div>
        <div class="hud">
          <div id="hud-extra"></div>
          <div class="hud-item">
            <span id="hud-clock">0.0s</span>
            <label>sim time</label>
          </div>
        </div>
      </header>
      <main>
        <div class="stage-col" id="stage-col">
          <div id="panes"></div>
          <div id="start-gate">
            <button id="start-btn">▶ START</button>
            <div id="start-hint" class="start-hint">Pick a scenario and tune the knobs first — traffic flows when you start.</div>
          </div>
        </div>
        <aside id="side"></aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
