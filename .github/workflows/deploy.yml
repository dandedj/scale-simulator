name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment, but do NOT cancel one in flight — the
# Pages deployment id is the commit SHA, so cancelling mid-flight leaves the
# deployment wedged and same-SHA retries collide with it. Matches GitHub's
# official Pages workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Pages serves from /scale-simulator/, so asset URLs need that prefix;
      # plain `npm run build` stays root-relative for any other host.
      - run: npm run build -- --base=/scale-simulator/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
